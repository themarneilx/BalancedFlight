name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Run offline regression checks
        run: bash tests/offline/run.sh

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: balancedflight-${{ github.event.release.tag_name }}
          path: build/libs/*.jar
          if-no-files-found: error
